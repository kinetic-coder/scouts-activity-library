<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubs Quiz Night</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1a33;
      --panel: #1a2a4d;
      --panel-border: #4a628c;
      --text: #f4f7ff;
      --muted: #c5d0ea;
      --accent: #2f78c9;
      --accent-hover: #3f8dde;
      --correct: #1a7a52;
      --focus: #b3d9ff;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #1a2f58 0%, var(--bg) 55%);
      color: var(--text);
      font: clamp(17px, 2.1vw, 22px) / 1.45 "Trebuchet MS", "Segoe UI", sans-serif;
    }
    body { min-height: 100vh; }
    button, a.button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      padding: 0.7rem 1.1rem;
      min-height: 48px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    button:hover, a.button:hover,
    button:focus-visible, a.button:focus-visible {
      background: var(--accent-hover);
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    button.secondary, a.button.secondary {
      background: #314769;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: flex; flex-direction: column; }
    #menu {
      max-width: 1100px;
      margin: 0 auto;
      padding: clamp(1.2rem, 4vw, 3rem);
      gap: 1.5rem;
    }
    #menu header h1 {
      margin: 0.2rem 0 0.6rem;
      font-size: clamp(2.4rem, 7vw, 4.4rem);
      line-height: 1.05;
    }
    #menu header p { margin: 0; color: var(--muted); max-width: 42rem; }
    .eyebrow {
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.85rem;
      color: #9eb4db;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 1rem;
    }
    .card {
      background: color-mix(in srgb, var(--panel) 92%, black);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 100%;
    }
    .card .glyph {
      font-size: 2.6rem;
      line-height: 1;
    }
    .card h2 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }
    .card p {
      margin: 0;
      color: var(--muted);
      flex: 1;
    }
    .card .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-top: 0.4rem;
    }
    #menu footer {
      color: var(--muted);
      font-size: 0.9rem;
    }
    #deck {
      justify-content: space-between;
    }
    #deck .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem clamp(1rem, 3vw, 2rem);
      background: rgba(15, 26, 51, 0.88);
      border-bottom: 1px solid #314769;
      position: sticky;
      top: 0;
      z-index: 2;
      backdrop-filter: blur(6px);
    }
    #deck .topbar .meta {
      color: var(--muted);
      font-size: 0.95rem;
    }
    #slide {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
      padding: clamp(1rem, 3vw, 2rem);
      gap: 0.65rem;
    }
    #slide h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      line-height: 1.12;
    }
    #slide ol {
      margin: 0;
      padding-left: 1.2em;
    }
    #slide li {
      margin: 0.4rem 0;
      padding: 0.35rem 0.5rem;
      border-radius: 10px;
      font-size: clamp(1.1rem, 2.8vw, 1.8rem);
    }
    #slide li.correct {
      background: var(--correct);
    }
    #slide .note {
      margin: 0;
      color: #b7f0d0;
      font-size: clamp(1rem, 2.2vw, 1.35rem);
    }
    #slide .kicker {
      margin: 0;
      color: #9eb4db;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.9rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      padding: 0.75rem clamp(1rem, 3vw, 2rem);
      background: #172850;
      border-top: 1px solid #314769;
      position: sticky;
      bottom: 0;
    }
    #count {
      margin-left: auto;
      color: var(--muted);
    }
    @media print {
      body { background: white; color: black; }
      .topbar, .toolbar, #menu footer, .card .actions a.secondary { display: none !important; }
      .screen { display: none !important; }
      #deck.active { display: block !important; }
      #slide { min-height: auto; }
    }
  </style>
  <link rel="stylesheet" href="../../../../assets/styles/scouts-presentation.css">
</head>
<body>
  <section id="menu" class="screen active" aria-label="Choose a quiz">
    <header>
      <p class="eyebrow">Euxton Methodist Cubs · Quiz Night</p>
      <h1>Choose a quiz</h1>
      <p>Pick a theme to project. Each quiz asks all 10 questions first, then repeats them so you can reveal answers. Press Esc during a quiz to return here.</p>
    </header>
    <div class="grid" id="quiz-cards"></div>
    <footer>Works offline as a single file. Arrow keys move slides; Space reveals an answer or advances.</footer>
  </section>

  <section id="deck" class="screen" aria-label="Quiz presentation">
    <div class="topbar">
      <button type="button" class="secondary" id="back-menu">All quizzes</button>
      <div class="meta" id="deck-title"></div>
    </div>
    <div id="slide" aria-live="polite" aria-atomic="true"></div>
    <div class="toolbar">
      <button type="button" id="prev">Previous</button>
      <button type="button" id="reveal">Reveal answer</button>
      <button type="button" id="next">Next</button>
      <span id="count" role="status" aria-live="polite"></span>
    </div>
  </section>

  <script>
    const quizzes = [
      {
        id: "space",
        title: "Space Quiz",
        glyph: "🚀",
        blurb: "Planets, astronauts and strange space facts. 10 questions.",
        answersHref: "../../../../assets/cubs-space-quiz/answers.html",
        intro: "Space Quiz: 10 Questions",
        transition: "Stop! Swap sheets or get ready to mark.",
        ending: "Mission complete, space explorers!",
        questions: [
          ["How many planets are in our Solar System?", ["Seven", "Eight", "Nine"], 1, "There are eight planets. Pluto is classed as a dwarf planet."],
          ["Which is the largest planet?", ["Earth", "Saturn", "Jupiter"], 2, "Jupiter is the largest planet in our Solar System."],
          ["Which planet is known as the Red Planet?", ["Mars", "Venus", "Neptune"], 0, "Iron minerals in Martian soil oxidise, or rust, making Mars look red."],
          ["What kind of object is the Sun?", ["A planet", "A star", "A moon"], 1, "The Sun is the one star at the centre of our Solar System."],
          ["Which planet is the hottest?", ["Mercury", "Venus", "Mars"], 1, "Venus is hottest because its thick atmosphere traps heat."],
          ["Which mission first landed people on the Moon?", ["Apollo 11", "Voyager 1", "Artemis I"], 0, "Apollo 11 first landed people on the Moon in 1969."],
          ["About how strong is gravity on the Moon compared with Earth?", ["One half", "One sixth", "The same"], 1, "The Moon's surface gravity is about one sixth of Earth's."],
          ["Which planet is famous for its bright rings?", ["Saturn", "Mars", "Mercury"], 0, "All four giant planets have rings, but Saturn's are the brightest and most extensive."],
          ["True or false: a day on Venus is longer than a year on Venus.", ["True", "False"], 0, "Venus rotates so slowly that one full spin takes longer than one orbit around the Sun."],
          ["Why do astronauts float inside the International Space Station?", ["There is no gravity in space", "They and the station are falling around Earth together", "Spacesuits make them float"], 1, "They are falling around Earth together: microgravity."]
        ]
      },
      {
        id: "music",
        title: "Music Quiz",
        glyph: "♪",
        blurb: "Instruments, rhythms and musical knowledge. 10 questions.",
        answersHref: "../../../../assets/cubs-music-quiz/answers.html",
        intro: "Music Quiz: 10 Questions",
        transition: "Answer round: reveal the answers!",
        ending: "Well done, Cubs!",
        questions: [
          ["How many strings does a guitar usually have?", ["Four", "Six", "Eight"], 1, "Most standard guitars have six strings."],
          ["True or false: a piano has strings inside it?", ["True", "False"], 0, "Hammers strike strings inside an acoustic piano."],
          ["Which musical word means fast and lively?", ["Adagio", "Allegro"], 1, "Allegro means fast and lively."],
          ["What do we call a group of people singing together?", ["Choir", "Orchestra", "Band"], 0, "A choir sings together."],
          ["True or false: drums are percussion instruments.", ["True", "False"], 0, "Drums are percussion instruments."],
          ["Which instrument do you blow into?", ["Trumpet", "Violin", "Cello"], 0, "A trumpet is played by blowing through a mouthpiece."],
          ["How many beats are in a bar of 4/4 time?", ["Three", "Four", "Five"], 1, "There are four beats in a bar of 4/4."],
          ["Which musical word means quiet or soft?", ["Forte", "Piano"], 1, "Piano means soft."],
          ["True or false: sound travels faster through air than water.", ["True", "False"], 1, "Sound generally travels faster through water."],
          ["Which of these is a woodwind instrument?", ["Flute", "Trombone", "Drum"], 0, "A flute belongs to the woodwind family."]
        ]
      },
      {
        id: "marvel",
        title: "Marvel Quiz",
        glyph: "★",
        blurb: "Heroes, superpowers and Marvel trivia. 10 questions.",
        answersHref: "../../../../assets/cubs-marvel-quiz/answers.html",
        intro: "Marvel Quiz: 10 Questions",
        transition: "Answer round!",
        ending: "Super work, Cubs!",
        questions: [
          ["What is Spider-Man's real name?", ["Peter Parker", "Tony Stark", "Bruce Banner"], 0, "Peter Parker is Spider-Man."],
          ["Which superhero carries a shield with a star?", ["Thor", "Captain America", "Hawkeye"], 1, "Captain America carries the famous shield."],
          ["What is Thor's hammer called?", ["Mjolnir", "Stormbreaker", "Vibranium"], 0, "Thor's enchanted hammer is Mjolnir."],
          ["True or false: Hulk is usually green.", ["True", "False"], 0, "The best-known version of Hulk is green."],
          ["Which hero wears a high-tech suit of armour?", ["Iron Man", "Ant-Man", "Doctor Strange"], 0, "Tony Stark wears Iron Man armour."],
          ["What is the name of Black Panther's home country?", ["Wakanda", "Asgard", "Sokovia"], 0, "Black Panther protects Wakanda."],
          ["Which superhero can shrink to the size of an insect?", ["Falcon", "Ant-Man", "Vision"], 1, "Ant-Man can shrink using Pym Particles."],
          ["True or false: Groot often says 'I am Groot'.", ["True", "False"], 0, "Groot's signature phrase is 'I am Groot'."],
          ["Which Marvel team includes Star-Lord and Rocket?", ["X-Men", "Fantastic Four", "Guardians of the Galaxy"], 2, "Star-Lord and Rocket are Guardians of the Galaxy."],
          ["Which Infinity Stone is in the centre of Vision's forehead in the MCU?", ["Time Stone", "Mind Stone", "Space Stone"], 1, "Vision has the Mind Stone in his forehead."]
        ]
      },
      {
        id: "science",
        title: "Weird but True Science",
        glyph: "◈",
        blurb: "Ten surprising animal facts. Choose A, B or C, then reveal answers.",
        answersHref: "../../../../assets/cubs-weird-science-quiz/answers.html",
        intro: "Weird but True Science: 10 Questions",
        transition: "Stop! Swap answer sheets, then reveal.",
        ending: "Well done! What was the strangest fact?",
        questions: [
          ["How many hearts does an octopus have?", ["One", "Two", "Three"], 2, "An octopus has three hearts."],
          ["What do butterflies use to taste?", ["Their feet", "Their wings", "Their antennae"], 0, "Butterflies have taste sensors on their feet."],
          ["What shape is wombat poo?", ["Round", "Cube-shaped", "Spiral"], 1, "Wombats produce cube-shaped droppings."],
          ["What can an axolotl regrow?", ["Lost limbs", "Its entire skeleton instantly", "A second head"], 0, "Axolotls can regenerate limbs."],
          ["How can dolphins sleep while still surfacing to breathe?", ["Both brain halves switch off", "One brain hemisphere rests at a time", "They never sleep"], 1, "Dolphins can rest one brain hemisphere at a time."],
          ["What colour is a polar bear's skin?", ["White", "Pink", "Black"], 2, "Polar bears have black skin beneath their fur."],
          ["How can some aquatic turtles take in oxygen underwater?", ["Through specialised tissue near their rear end", "Through their shells", "Through their claws"], 0, "Some turtles absorb dissolved oxygen through specialised cloacal tissue."],
          ["Which animal has fingerprints surprisingly similar to ours?", ["Koala", "Penguin", "Hedgehog"], 0, "Koalas have fingerprints that resemble human prints."],
          ["How many eyelids are commonly described for a camel's eye?", ["One", "Two", "Three"], 2, "Camels have upper and lower eyelids plus a protective third eyelid."],
          ["What can a wood frog survive during winter?", ["Being partly frozen", "Living without water for years", "Boiling temperatures"], 0, "Wood frogs can survive partial freezing."]
        ]
      }
    ];

    const menu = document.getElementById("menu");
    const deck = document.getElementById("deck");
    const cards = document.getElementById("quiz-cards");
    const slideEl = document.getElementById("slide");
    const deckTitle = document.getElementById("deck-title");
    const countEl = document.getElementById("count");
    const revealBtn = document.getElementById("reveal");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    let activeQuiz = null;
    let slides = [];
    let index = 0;
    const revealed = new Set();

    function buildSlides(quiz) {
      return [
        { kind: "intro" },
        ...quiz.questions.map((_, i) => ({ kind: "question", i })),
        { kind: "transition" },
        ...quiz.questions.map((_, i) => ({ kind: "answer", i })),
        { kind: "end" }
      ];
    }

    function showMenu() {
      activeQuiz = null;
      slides = [];
      index = 0;
      revealed.clear();
      menu.classList.add("active");
      deck.classList.remove("active");
      history.replaceState(null, "", "#");
    }

    function startQuiz(quizId) {
      activeQuiz = quizzes.find((q) => q.id === quizId);
      if (!activeQuiz) return;
      slides = buildSlides(activeQuiz);
      index = 0;
      revealed.clear();
      deckTitle.textContent = activeQuiz.title;
      menu.classList.remove("active");
      deck.classList.add("active");
      history.replaceState(null, "", "#" + activeQuiz.id);
      render();
    }

    function render() {
      if (!activeQuiz) return;
      const slide = slides[index];
      const q = activeQuiz.questions;
      slideEl.replaceChildren();

      const kicker = document.createElement("p");
      kicker.className = "kicker";
      const heading = document.createElement("h1");

      if (slide.kind === "intro") {
        kicker.textContent = activeQuiz.title;
        heading.textContent = activeQuiz.intro;
        slideEl.append(kicker, heading);
      } else if (slide.kind === "transition") {
        kicker.textContent = "Marking time";
        heading.textContent = activeQuiz.transition;
        slideEl.append(kicker, heading);
      } else if (slide.kind === "end") {
        kicker.textContent = "Finished";
        heading.textContent = activeQuiz.ending;
        slideEl.append(kicker, heading);
      } else {
        const item = q[slide.i];
        kicker.textContent = (slide.kind === "answer" ? "Answer" : "Question") + " " + (slide.i + 1) + " of " + q.length;
        heading.textContent = item[0];
        const list = document.createElement("ol");
        list.type = "A";
        item[1].forEach((choice, j) => {
          const li = document.createElement("li");
          li.textContent = choice;
          if (slide.kind === "answer" && revealed.has(index) && j === item[2]) {
            li.className = "correct";
          }
          list.append(li);
        });
        slideEl.append(kicker, heading, list);
        if (slide.kind === "answer" && revealed.has(index)) {
          const note = document.createElement("p");
          note.className = "note";
          note.textContent = "✓ " + item[3];
          slideEl.append(note);
        }
      }

      revealBtn.hidden = slide.kind !== "answer";
      revealBtn.disabled = slide.kind === "answer" && revealed.has(index);
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slides.length - 1;
      countEl.textContent = "Slide " + (index + 1) + " / " + slides.length;
    }

    function step(delta) {
      if (!activeQuiz) return;
      index = Math.max(0, Math.min(slides.length - 1, index + delta));
      render();
    }

    function revealAnswer() {
      if (!activeQuiz || slides[index].kind !== "answer") return;
      revealed.add(index);
      render();
    }

    quizzes.forEach((quiz) => {
      const article = document.createElement("article");
      article.className = "card";
      article.innerHTML =
        '<div class="glyph" aria-hidden="true">' + quiz.glyph + "</div>" +
        "<h2></h2><p></p><div class=\"actions\"></div>";
      article.querySelector("h2").textContent = quiz.title;
      article.querySelector("p").textContent = quiz.blurb;
      const actions = article.querySelector(".actions");

      const start = document.createElement("button");
      start.type = "button";
      start.textContent = "Start presentation";
      start.addEventListener("click", () => startQuiz(quiz.id));

      const answers = document.createElement("a");
      answers.className = "button secondary";
      answers.href = quiz.answersHref;
      answers.target = "_blank";
      answers.rel = "noopener";
      answers.textContent = "Leader answers";

      actions.append(start, answers);
      cards.append(article);
    });

    document.getElementById("back-menu").addEventListener("click", showMenu);
    prevBtn.addEventListener("click", () => step(-1));
    nextBtn.addEventListener("click", () => step(1));
    revealBtn.addEventListener("click", revealAnswer);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        showMenu();
        return;
      }
      if (!activeQuiz) return;
      if (event.key === "ArrowLeft") step(-1);
      if (event.key === "ArrowRight") step(1);
      if (event.key === " ") {
        event.preventDefault();
        if (slides[index].kind === "answer" && !revealed.has(index)) revealAnswer();
        else step(1);
      }
    });

    const initial = location.hash.replace(/^#/, "");
    if (initial && quizzes.some((q) => q.id === initial)) startQuiz(initial);
  </script>
</body>
</html>
