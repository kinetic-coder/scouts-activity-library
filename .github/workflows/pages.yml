name: Build and deploy Scout Library Pages
on:
  pull_request:
    paths: ['sessions/**', 'activities/**', 'assets/**', 'scripts/build_pages.py', 'requirements-pages.txt', '.github/workflows/pages.yml']
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-pages.txt
      - run: python scripts/build_pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: scout-pages-preview
          path: site/
          include-hidden-files: true
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scout-pages-preview
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
