name: Validate activity library

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python -m unittest discover -s tests -v \
            2>&1 | tee test-results/unittest.log
      - name: Validate delivered-only activity history against real sessions
        if: success() || failure()
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          python scripts/activity_history.py \
            --output test-results/activity-history.json \
            2>&1 | tee test-results/activity-history.log

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-library-validation
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
