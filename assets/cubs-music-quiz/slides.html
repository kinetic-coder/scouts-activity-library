<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cubs Music Quiz</title><style>body{font-family:system-ui;margin:0;background:#111c38;color:white}main{max-width:950px;margin:auto;padding:24px}button{font:inherit;padding:12px;margin:6px;border-radius:10px;border:0;cursor:pointer}section{min-height:70vh;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(2rem,6vw,4rem)}h2{font-size:clamp(1.8rem,5vw,3rem)}li{font-size:clamp(1.2rem,3vw,2rem);margin:16px 0}.correct{background:#197e55;padding:8px;border-radius:8px}.toolbar{position:sticky;bottom:0;background:#172950;padding:8px} @media print{body{background:white;color:black}.toolbar{display:none}section{min-height:0;break-after:page}}</style><nav style="position:relative;z-index:3;padding:10px 20px;background:#24365a"><a href="../quiz-index.html" style="color:white;font:600 16px system-ui;text-decoration:underline">← Back to quiz menu</a></nav><main><section id="slide"></section><div class="toolbar"><button onclick="step(-1)">◀ Previous</button><button id="reveal" onclick="revealed.add(index);render()">Reveal answer</button><button onclick="step(1)">Next ▶</button><span id="count"></span></div></main><script>const q=[["How many strings does a guitar usually have?",["Four","Six","Eight"],1,"Most standard guitars have six strings."],["True or false: a piano has strings inside it?",["True","False"],0,"Hammers strike strings inside an acoustic piano."],["Which musical word means fast and lively?",["Adagio","Allegro"],1,"Allegro means fast and lively."],["What do we call a group of people singing together?",["Choir","Orchestra","Band"],0,"A choir sings together."],["True or false: drums are percussion instruments.",["True","False"],0,"Drums are percussion instruments."],["Which instrument do you blow into?",["Trumpet","Violin","Cello"],0,"A trumpet is played by blowing through a mouthpiece."],["How many beats are in a bar of 4/4 time?",["Three","Four","Five"],1,"There are four beats in a bar of 4/4."],["Which musical word means quiet or soft?",["Forte","Piano"],1,"Piano means soft."],["True or false: sound travels faster through air than water.",["True","False"],1,"Sound generally travels faster through water."],["Which of these is a woodwind instrument?",["Flute","Trombone","Drum"],0,"A flute belongs to the woodwind family."]];let index=0;const revealed=new Set();const slides=[{kind:'intro'},...q.map((x,i)=>({kind:'question',i})),{kind:'transition'},...q.map((x,i)=>({kind:'answer',i})),{kind:'end'}];function render(){const s=slides[index],e=document.getElementById('slide');e.replaceChildren();const h=document.createElement('h1');if(s.kind==='intro')h.textContent='🎵 Cubs Music Quiz: 10 Questions';else if(s.kind==='transition')h.textContent='🎯 Answer Round: Reveal the answers!';else if(s.kind==='end')h.textContent='🎉 Well done, Cubs!';else{h.textContent=(s.i+1)+'. '+q[s.i][0];const ul=document.createElement('ol');ul.type='A';q[s.i][1].forEach((a,j)=>{const li=document.createElement('li');li.textContent=a;if(s.kind==='answer'&&revealed.has(index)&&j===q[s.i][2])li.className='correct';ul.append(li)});e.append(h,ul);if(s.kind==='answer'&&revealed.has(index)){const p=document.createElement('p');p.textContent='✓ '+q[s.i][3];e.append(p)}}if(!e.children.length)e.append(h);document.getElementById('reveal').hidden=s.kind!=='answer';document.getElementById('count').textContent='Slide '+(index+1)+' / '+slides.length}function step(n){index=Math.max(0,Math.min(slides.length-1,index+n));render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key===' '){e.preventDefault();if(slides[index].kind==='answer'&&!revealed.has(index)){revealed.add(index);render()}else step(1)}});render();</script></html>
