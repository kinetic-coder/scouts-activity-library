<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cubs Space Quiz — Team Sheet</title>
  <style>
    body{font:18px/1.4 system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;color:#151b31}h1{font-size:2rem;margin-bottom:.4rem}.label{border-bottom:2px solid #333;display:inline-block;min-width:300px;height:1.5rem}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 34px;margin:2rem 0}.answer{border:2px solid #303a62;border-radius:10px;padding:14px;font-size:1.25rem;min-height:64px}.score{margin-top:2rem;border:3px solid #303a62;border-radius:12px;padding:16px;font-size:1.4rem}button{font:inherit;padding:.6rem 1rem}@media print{button{display:none}body{padding:0}.answer{min-height:54px}}
  </style><link rel="stylesheet" href="../styles/scouts-printables.css">
</head>
<body>
  <h1>🚀 Cubs Space Quiz</h1>
  <p>Team label (no personal names): <span class="label"></span></p>
  <p>Circle or write <strong>A, B or C</strong> for each answer.</p>
  <button type="button" onclick="print()">Print team sheet</button>
  <div class="grid">
    <div class="answer"><strong>1.</strong> A / B / C</div><div class="answer"><strong>2.</strong> A / B / C</div>
    <div class="answer"><strong>3.</strong> A / B / C</div><div class="answer"><strong>4.</strong> A / B / C</div>
    <div class="answer"><strong>5.</strong> A / B / C</div><div class="answer"><strong>6.</strong> A / B / C</div>
    <div class="answer"><strong>7.</strong> A / B / C</div><div class="answer"><strong>8.</strong> A / B / C</div>
    <div class="answer"><strong>9.</strong> A / B / C</div><div class="answer"><strong>10.</strong> A / B / C</div>
  </div>
  <div class="score"><strong>Mission score:</strong> ______ / 10</div>
</body>
</html>
