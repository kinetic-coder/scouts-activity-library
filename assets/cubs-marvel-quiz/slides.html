<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cubs Marvel Quiz</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#141b36;color:white}main{max-width:1000px;margin:auto;padding:5vw}section{min-height:72vh;display:flex;flex-direction:column;justify-content:center}h1{font-size:clamp(2.1rem,6vw,4.8rem)}h2{font-size:clamp(1.8rem,5vw,3.7rem)}li{font-size:clamp(1.3rem,3vw,2.3rem);margin:16px 0;padding:9px;border-radius:10px}.correct{background:#187348}.toolbar{position:sticky;bottom:0;background:#26365e;padding:10px;display:flex;gap:8px;flex-wrap:wrap}button{padding:12px;border-radius:10px;border:0;font:inherit;cursor:pointer}button[hidden]{display:none}#count{padding:12px}@media print{body{background:white;color:black}.toolbar{display:none}section{break-after:page;min-height:90vh}}</style><main><section id="slide"></section><div class="toolbar"><button onclick="step(-1)">◀ Back</button><button id="reveal" onclick="revealed.add(index);render()">Reveal answer</button><button onclick="step(1)">Next ▶</button><span id="count"></span></div></main><script>const q=[["What is Spider-Man's real name?",["Peter Parker","Tony Stark","Bruce Banner"],0,"Peter Parker is Spider-Man."],["Which superhero carries a shield with a star?",["Thor","Captain America","Hawkeye"],1,"Captain America carries the famous shield."],["What is Thor's hammer called?",["Mjolnir","Stormbreaker","Vibranium"],0,"Thor's enchanted hammer is Mjolnir."],["True or false: Hulk is usually green.",["True","False"],0,"The best-known version of Hulk is green."],["Which hero wears a high-tech suit of armour?",["Iron Man","Ant-Man","Doctor Strange"],0,"Tony Stark wears Iron Man armour."],["What is the name of Black Panther's home country?",["Wakanda","Asgard","Sokovia"],0,"Black Panther protects Wakanda."],["Which superhero can shrink to the size of an insect?",["Falcon","Ant-Man","Vision"],1,"Ant-Man can shrink using Pym Particles."],["True or false: Groot often says 'I am Groot'.",["True","False"],0,"Groot's signature phrase is 'I am Groot'."],["Which Marvel team includes Star-Lord and Rocket?",["X-Men","Fantastic Four","Guardians of the Galaxy"],2,"Star-Lord and Rocket are Guardians of the Galaxy."],["Which Infinity Stone is in the centre of Vision's forehead in the MCU?",["Time Stone","Mind Stone","Space Stone"],1,"Vision has the Mind Stone in his forehead."]];const slides=[{kind:'intro'},...q.map((_,i)=>({kind:'question',i})),{kind:'transition'},...q.map((_,i)=>({kind:'answer',i})),{kind:'end'}];let index=0;const revealed=new Set();function render(){const s=slides[index],e=document.getElementById('slide');e.replaceChildren();const h=document.createElement('h1');if(s.kind==='intro')h.textContent='🦸 Cubs Marvel Quiz: 10 Questions';else if(s.kind==='transition')h.textContent='🎯 Answer Round!';else if(s.kind==='end')h.textContent='🎉 Super work, Cubs!';else{h.textContent=(s.i+1)+'. '+q[s.i][0];const ol=document.createElement('ol');ol.type='A';q[s.i][1].forEach((a,j)=>{const li=document.createElement('li');li.textContent=a;if(s.kind==='answer'&&revealed.has(index)&&j===q[s.i][2])li.className='correct';ol.append(li)});e.append(h,ol);if(s.kind==='answer'&&revealed.has(index)){const p=document.createElement('p');p.textContent='✓ '+q[s.i][3];e.append(p)}}if(!e.children.length)e.append(h);document.getElementById('reveal').hidden=s.kind!=='answer';document.getElementById('count').textContent='Slide '+(index+1)+' of '+slides.length}function step(n){index=Math.max(0,Math.min(slides.length-1,index+n));render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key===' '){e.preventDefault();if(slides[index].kind==='answer'&&!revealed.has(index)){revealed.add(index);render()}else step(1)}});render();</script></html>
